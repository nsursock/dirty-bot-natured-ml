# TD3 baseline for Pendulum (HPO best: n_envs=64, solves in ~23 s at eval reward -148).
algo: TD3
env: Pendulum
n_envs: 64
train_freq: 1
gradient_steps: 8
learning_rate: 0.0008938615145126269
batch_size: 128
buffer_size: 500000
learning_starts: 5000
gamma: 0.9679075748758313
tau: 0.013059821770632293
policy_delay: 3
target_policy_noise: 0.2805421209221104
target_noise_clip: 0.5524870520532993
action_noise_std: 0.16179798963580774
policy_kwargs:
  net_arch: [256, 256]
seed: 0
