# SAC baseline for Pendulum (HPO best: n_envs=64, solves in ~20 s at eval reward -131).
algo: SAC
env: Pendulum
n_envs: 64
train_freq: 1
gradient_steps: 8
learning_rate: 0.0018493240125589667
batch_size: 256
buffer_size: 100000
learning_starts: 1000
gamma: 0.9544901775920978
tau: 0.008491112161695773
policy_kwargs:
  net_arch: [256, 256]
seed: 0
