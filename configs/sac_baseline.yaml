# Verified SAC baseline for Pendulum from update-intensity diagnostic.
# Robust at the relaxed solve threshold of -200 across 3 seeds.
algo: SAC
env: Pendulum
n_envs: 128
train_freq: 8
gradient_steps: 8
learning_rate: 0.0015
batch_size: 128
buffer_size: 1000000
learning_starts: 10000
gamma: 0.95
tau: 0.0065
policy_kwargs:
  net_arch: [256, 256]
seed: 0
